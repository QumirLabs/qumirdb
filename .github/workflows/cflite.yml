name: ClusterFuzzLite

# Fuzzing of the qdb query pipeline (fuzz/) on the master head: batch fuzzing
# every night, corpus pruning every day. Pull requests are not fuzzed.
on:
  schedule:
    - cron: '0 1 * * *'  # batch
    - cron: '0 5 * * *'  # prune
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [batch, prune]
        default: batch

permissions: read-all

concurrency:
  group: cflite
  cancel-in-progress: false

jobs:
  # An open issue with the fuzz label pauses batch fuzzing, so a crash that is
  # not fixed yet is not reported again every night. Closing it resumes fuzzing.
  gate:
    if: github.event.schedule == '0 1 * * *' || inputs.mode == 'batch'
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      open: ${{ steps.issues.outputs.open }}
    steps:
      - name: Find open fuzz issues
        id: issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label fuzz --state open \
            --json number,title --jq '.[] | "#\(.number) \(.title)"')
          if [ -n "$open" ]; then
            echo "Fuzzing is paused until these issues are closed:" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$open" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

  batch:
    needs: gate
    # The corpus token is used here: never hand it to a dispatch from another branch.
    if: github.ref == 'refs/heads/master' && needs.gate.outputs.open == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      # The actions read base_os_version from .clusterfuzzlite/project.yaml in the workspace.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .clusterfuzzlite
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c++
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}
          minimize-crashes: true
          # Corpus storage: the private repository QumirLabs/qumirdb-fuzz-corpus;
          # FUZZ_CORPUS_TOKEN is a fine-grained token with contents:write on it.
          storage-repo: https://x-access-token:${{ secrets.FUZZ_CORPUS_TOKEN }}@github.com/QumirLabs/qumirdb-fuzz-corpus.git
          storage-repo-branch: main
      - name: File an issue for the finding
        if: failure() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SANITIZER: ${{ matrix.sanitizer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .clusterfuzzlite/report_finding.sh

  # The corpus of qdb_fuzz_plan is merged in about as long as the whole budget of
  # one target, so the targets are pruned in two passes, one after the other: the
  # budget is split only across the targets of a pass, and no two passes push to
  # the corpus repository at the same time.
  prune:
    name: prune (${{ matrix.name }})
    # The corpus token is used here: never hand it to a dispatch from another branch.
    if: github.ref == 'refs/heads/master' && (github.event.schedule == '0 5 * * *' || inputs.mode == 'prune')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: plan
            targets: qdb_fuzz_plan
          - name: parse and vm
            targets: qdb_fuzz_parse qdb_fuzz_vm
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .clusterfuzzlite
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c++
          sanitizer: address
      # run_fuzzers prunes every fuzzer in build-out: keep only the targets of this pass.
      # build_fuzzers runs in a root container, so build-out belongs to root.
      - name: Keep the targets of this pass
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in qdb_fuzz_parse qdb_fuzz_plan qdb_fuzz_vm; do
            case " $TARGETS " in
              *" $target "*) ;;
              *) sudo rm -f "build-out/$target" ;;
            esac
          done
          ls build-out
      - name: Prune the corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The budget is split across the targets of this pass.
          fuzz-seconds: 3600
          mode: prune
          sanitizer: address
          # Corpus storage: the private repository QumirLabs/qumirdb-fuzz-corpus;
          # FUZZ_CORPUS_TOKEN is a fine-grained token with contents:write on it.
          storage-repo: https://x-access-token:${{ secrets.FUZZ_CORPUS_TOKEN }}@github.com/QumirLabs/qumirdb-fuzz-corpus.git
          storage-repo-branch: main

  # Prune drops the crashing inputs from the corpus, and run_fuzzers returns no
  # crash for them, so the prune job can succeed with crashes in its log. The
  # sanitizer reports are in the prune job log, so they are filed from there;
  # the inputs come from the corpus repository history. The script does nothing
  # when the log has no crash.
  prune-report:
    needs: prune
    if: ${{ !cancelled() && needs.prune.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .clusterfuzzlite
      - name: File issues for the crashes found by prune
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FUZZ_CORPUS_URL: https://x-access-token:${{ secrets.FUZZ_CORPUS_TOKEN }}@github.com/QumirLabs/qumirdb-fuzz-corpus.git
        run: |
          : > "$RUNNER_TEMP/prune.log"
          for job in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              --paginate --jq '.jobs[] | select(.name | startswith("prune (")) | .id'); do
            # Job logs carry ANSI colour codes, which gh refuses to print without the flag.
            gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" >> "$RUNNER_TEMP/prune.log"
          done
          bash .clusterfuzzlite/report_prune.sh "$RUNNER_TEMP/prune.log"
