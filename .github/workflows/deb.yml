name: Debian packages

# Manual only: github.run_number then increments once per deliberate build,
# giving 0.1.1, 0.1.2, 0.1.3 without gaps.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release with the packages'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Arrow apt source
      run: |
        sudo apt-get install -y ca-certificates lsb-release wget
        CODENAME=$(lsb_release --codename --short)
        wget "https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-${CODENAME}.deb"
        sudo apt-get install -y "./apache-arrow-apt-source-latest-${CODENAME}.deb"

    - name: apt-get update
      run: sudo apt-get update

    - name: Install packages
      run: |
        sudo apt-get install -y cmake ninja-build pkg-config llvm-22-dev lld \
          libarrow-dev libparquet-dev libpcre2-dev libreadline-dev liburing-dev \
          g++-16 dpkg-dev

    - name: configure
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DLLVM_DIR="$(llvm-config-22 --cmakedir)" \
          -DCMAKE_PREFIX_PATH="$(llvm-config-22 --prefix)" \
          -DCMAKE_CXX_COMPILER=g++-16 \
          -DCMAKE_C_COMPILER=gcc-16 \
          -DQDB_BUILD_SERVICE=ON \
          -DQDB_LLVM_LINK_SHARED=ON \
          -DQDB_BUILD_NUMBER=${{ github.run_number }}

    - name: build
      run: cmake --build build

    - name: package
      run: cd build && cpack -G DEB

    - name: verify packages
      run: |
        cd build
        for deb in *.deb; do
          echo "=== $deb ==="
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
        done

    - uses: actions/upload-artifact@v4
      with:
        name: qumirdb-${{ matrix.arch }}
        path: build/*.deb

  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: read version
      id: version
      run: sed -n 's/^project(qumirdb VERSION \([0-9.]*\)).*/version=\1/p' CMakeLists.txt >> "$GITHUB_OUTPUT"

    - uses: actions/download-artifact@v4
      with:
        path: packages
        merge-multiple: true

    - uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
        name: QumirDB ${{ steps.version.outputs.version }}-${{ github.run_number }}
        files: packages/*.deb
