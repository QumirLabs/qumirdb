name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  text-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Checkout qumir
      run: git submodule update --init externals/qumir
    - name: Check comments and invisible characters
      run: python3 externals/qumir/tools/check_text.py

  build:
    permissions:
      checks: write
      pull-requests: write
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      QDB_JIT_CACHE_DIR: ${{ github.workspace }}/build/jit-cache

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install Arrow apt source
      run: |
        sudo apt-get install -y ca-certificates lsb-release wget
        CODENAME=$(lsb_release --codename --short)
        wget "https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-${CODENAME}.deb"
        sudo apt-get install -y "./apache-arrow-apt-source-latest-${CODENAME}.deb"
    - name: apt-get update
      run: sudo apt-get update
    - name: Install packages
      timeout-minutes: 16
      run: |
        # A slow mirror can stall the download for tens of minutes. Each retry
        # keeps the packages that were already fetched.
        for attempt in 1 2 3; do
          sudo timeout 300 apt-get install -y ccache cmake ninja-build pkg-config llvm-22-dev lld libgtest-dev libarrow-dev libparquet-dev libreadline-dev g++-16 && exit 0
          sudo dpkg --configure -a || true
        done
        exit 1
    - name: Set up ccache
      uses: Chocobo1/setup-ccache-action@a4d08616f5b614053bce228ddf881592f69d61d4 # v1.5.9
      with:
        install_ccache: false
        update_packager_index: false
        prepend_symlinks_to_path: false
        # Only pushes to master save the cache; pull requests restore it.
        store_cache: true
        remove_stale_cache: false
        ccache_options: |
          max_size=2G
    - name: Configure
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DLLVM_DIR="$(llvm-config-22 --cmakedir)" \
          -DCMAKE_PREFIX_PATH="$(llvm-config-22 --prefix)" \
          -DCMAKE_CXX_COMPILER=g++-16 \
          -DCMAKE_C_COMPILER=gcc-16 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DQDB_LLVM_LINK_SHARED=ON \
          -DQDB_BUILD_TESTS=ON
    - name: Build
      run: cmake --build build
    - name: Install Rust LLVM 22 toolchain
      run: rustup toolchain install 1.98.1 --profile minimal --component rust-src
    - name: Test
      env:
        RUSTUP_TOOLCHAIN: 1.98.1
      run: ctest --test-dir build -j "$(nproc)"
    - name: Test log on failure
      if: failure()
      run: cat build/Testing/Temporary/LastTest.log
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: build/test/*.xml
        check_name: Unit Test Results (Linux)
